name: Apply latest representative selection fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-latest-selection-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch source and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('api/crew-news-batch.js')
          text = path.read_text(encoding='utf-8')
          replacement = r'''function compareRepresentativeCandidates(a, b) {
            const sameActivity = sameRepresentativeActivity(a, b);

            // Different crew activities are ordered by freshness first. A leader post
            // is only a representative-quality advantage, not permission to pin an
            // older event above a newer confirmed activity from another member.
            if (!sameActivity) {
              const time =
                parseTime(b.sourcePublishedAt || b.publishedAt) -
                parseTime(a.sourcePublishedAt || a.publishedAt);
              if (time) return time;

              const tier = Number(a.representativeTier || 9) - Number(b.representativeTier || 9);
              if (tier) return tier;

              return Number(Boolean(b.isCrewLeader)) - Number(Boolean(a.isCrewLeader));
            }

            // Inside the same activity/date, keep representative quality/media as
            // tie-breakers so the best crew-wide source remains selected.
            const tier = Number(a.representativeTier || 9) - Number(b.representativeTier || 9);
            if (tier) return tier;

            const mediaPriority =
              Number(b.representativeMediaPriority || 0) -
              Number(a.representativeMediaPriority || 0);
            if (mediaPriority) return mediaPriority;

            const time =
              parseTime(b.sourcePublishedAt || b.publishedAt) -
              parseTime(a.sourcePublishedAt || a.publishedAt);
            if (time) return time;

            return Number(Boolean(b.isCrewLeader)) - Number(Boolean(a.isCrewLeader));
          }

          function parseTime'''
          pattern = re.compile(r'function compareRepresentativeCandidates\(a, b\) \{.*?\n\}\n\nfunction parseTime', re.S)
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one comparator block, replaced {count}')
          path.write_text(updated, encoding='utf-8')

          test = Path('tests/representative-selection-regression.test.js')
          test.write_text("""'use strict';

const assert = require('assert');
const batch = require('../api/crew-news-batch.js');
const { compareRepresentativeCandidates } = batch._internals;

const olderLeader = {
  representativeTier: 1,
  isCrewLeader: true,
  strictActivity: '러닝',
  activityDate: '2026-09-18',
  sourcePublishedAt: '2026-09-18 11:47:21'
};

const newerMember = {
  representativeTier: 2,
  isCrewLeader: false,
  strictActivity: '점호',
  activityDate: '2026-09-28',
  sourcePublishedAt: '2026-09-28 12:41:35'
};

assert(compareRepresentativeCandidates(newerMember, olderLeader) < 0,
  'newer member activity must outrank an older leader activity');
assert(compareRepresentativeCandidates(olderLeader, newerMember) > 0,
  'older leader activity must not pin above a newer member activity');

const sameEventMember = {
  representativeTier: 2,
  representativeMediaPriority: 0,
  isCrewLeader: false,
  strictActivity: '점호',
  activityDate: '2026-09-28',
  sourcePublishedAt: '2026-09-28 12:50:00'
};

const sameEventLeader = {
  representativeTier: 1,
  representativeMediaPriority: 0,
  isCrewLeader: true,
  strictActivity: '점호',
  activityDate: '2026-09-28',
  sourcePublishedAt: '2026-09-28 12:40:00'
};

assert(compareRepresentativeCandidates(sameEventLeader, sameEventMember) < 0,
  'leader representative should remain preferred inside the same activity/date');

console.log('representative-selection regression: ok');
""", encoding='utf-8')
          PY
      - name: Run targeted regression
        run: node tests/representative-selection-regression.test.js
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/crew-news-batch.js tests/representative-selection-regression.test.js
          git commit -m 'fix: prefer newer crew activity over stale leader post'
          git push origin HEAD:main
