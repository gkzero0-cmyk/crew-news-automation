name: Apply latest representative selection fix

on:
  push:
    branches:
      - fix/latest-crew-news-selection
    paths:
      - .github/workflows/apply-latest-selection-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-crew-news-selection
          fetch-depth: 0
      - name: Patch representative selection order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('api/crew-news-batch.js')
          text = path.read_text(encoding='utf-8')
          replacement = r'''function compareRepresentativeCandidates(a, b) {
            const sameActivity = sameRepresentativeActivity(a, b);

            // Different crew activities are ordered by freshness first. A leader post
            // is only a representative-quality advantage, not permission to pin an
            // older event above a newer confirmed activity from another member.
            if (!sameActivity) {
              const time =
                parseTime(b.sourcePublishedAt || b.publishedAt) -
                parseTime(a.sourcePublishedAt || a.publishedAt);
              if (time) return time;

              const tier = Number(a.representativeTier || 9) - Number(b.representativeTier || 9);
              if (tier) return tier;

              return Number(Boolean(b.isCrewLeader)) - Number(Boolean(a.isCrewLeader));
            }

            // Inside the same activity/date, keep the existing representative-quality
            // preference so the best crew-wide post/image remains the chosen source.
            const tier = Number(a.representativeTier || 9) - Number(b.representativeTier || 9);
            if (tier) return tier;

            const mediaPriority =
              Number(b.representativeMediaPriority || 0) -
              Number(a.representativeMediaPriority || 0);
            if (mediaPriority) return mediaPriority;

            const time =
              parseTime(b.sourcePublishedAt || b.publishedAt) -
              parseTime(a.sourcePublishedAt || a.publishedAt);
            if (time) return time;

            return Number(Boolean(b.isCrewLeader)) - Number(Boolean(a.isCrewLeader));
          }

          function parseTime'''
          pattern = re.compile(r'function compareRepresentativeCandidates\(a, b\) \{.*?\n\}\n\nfunction parseTime', re.S)
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one comparator block, replaced {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Run representative-selection regression
        run: node tests/representative-selection-regression.test.js
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- api/crew-news-batch.js; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/crew-news-batch.js
          git commit -m 'fix: prefer newer crew activity over stale leader post'
          git push origin HEAD:fix/latest-crew-news-selection
