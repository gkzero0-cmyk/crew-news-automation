name: Apply Jindugi trip start-date anchor

on:
  push:
    branches:
      - fix/jindugi-trip-start-date
    paths:
      - .github/workflows/apply-jindugi-trip-anchor.yml

permissions:
  contents: write

jobs:
  red-green-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jindugi-trip-start-date
          fetch-depth: 0

      - name: Verify trip-date regression is red
        shell: bash
        run: |
          set +e
          node tests/crew-news-audit-followups.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the new trip-date regression to fail before the patch."
            exit 1
          fi
          echo "Trip-date regression failed as expected before the patch."

      - name: Anchor verified ongoing trip update to 9/30
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/crew-news-batch.js')
          text = path.read_text(encoding='utf-8')
          old = """  '진드기': {
    '208412493': '2026-09-30',
    '208395133': '2026-09-30'
  }"""
          new = """  '진드기': {
    '208412493': '2026-09-30',
    '208395133': '2026-09-30',
    '208704035': '2026-09-30'
  }"""
          if old not in text:
              raise SystemExit('Jindugi manual activity-date block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify targeted regressions are green
        run: |
          node tests/representative-selection-regression.test.js
          node tests/crew-news-audit-followups.test.js

      - name: Commit tested date anchor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/crew-news-batch.js
          git commit -m 'fix: anchor Jindugi trip updates to verified start date'
          git push origin HEAD:fix/jindugi-trip-start-date
