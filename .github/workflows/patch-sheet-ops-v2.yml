name: Apply sheet operations improvements v2

on:
  push:
    branches:
      - 'feat/sheet-ops-improvements-20261004'
    paths:
      - '.github/workflows/patch-sheet-ops-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sheet-ops-improvements-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/patch_sheet_ops.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps-script/Code.gs tests
          git commit -m 'feat: improve sheet operations and diagnostics'
          git push origin HEAD:feat/sheet-ops-improvements-20261004
# rerun after test-harness compatibility guard
