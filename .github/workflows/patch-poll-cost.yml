name: Apply polling cost optimization

on:
  push:
    branches:
      - 'perf/crew-poll-cost-20261004'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/crew-poll-cost-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved optimization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          code_path = Path('apps-script/Code.gs')
          code = code_path.read_text()
          code = code.replace('신생 종겜 크루 멤버 현황 - 10분 자동 갱신', '신생 종겜 크루 멤버 현황 - 15분 자동 갱신')
          code = code.replace('이후 10분마다 자동 갱신', '이후 15분마다 자동 갱신')
          code = code.replace("'10분 자동갱신 설치'", "'15분 자동갱신 설치'")
          code = code.replace('TRIGGER_MINUTES: 10,', 'TRIGGER_MINUTES: 15,')
          code = code.replace("SCRIPT_VERSION: 'crew-apps-script-v1.7.2'", "SCRIPT_VERSION: 'crew-apps-script-v1.7.3'")
          code_path.write_text(code)

          for test_path in Path('tests').glob('*.test.js'):
              text = test_path.read_text()
              if 'crew-apps-script-v1.7.2' in text:
                  test_path.write_text(text.replace('crew-apps-script-v1.7.2', 'crew-apps-script-v1.7.3'))

          crew_path = Path('internal/crew-news.js')
          crew = crew_path.read_text()
          old_pattern = re.compile(r"async function fetchMenu\(station, headers\) \{.*?\n\}\n\nfunction normalizeVod", re.S)
          replacement = r'''const MENU_CACHE_TTL_MS = 6 * 60 * 60 * 1000;
          const menuCache = new Map();

          function menuCacheKey(station, headers = {}) {
            return String(station) + '|' + (headers && headers.Cookie ? 'auth' : 'public');
          }

          function clearMenuCacheForTest() {
            menuCache.clear();
          }

          async function fetchMenu(station, headers) {
            const key = menuCacheKey(station, headers);
            const cached = menuCache.get(key);
            if (cached && Date.now() - cached.at < MENU_CACHE_TTL_MS) return cached.value;
            if (cached) menuCache.delete(key);

            const urls = SOOP_MENU_HOSTS.map(host => `${host}/v1.1/channel/${encodeURIComponent(station)}/menu`);
            try {
              const result = await firstJson(urls, headers);
              if (!result.data || !Array.isArray(result.data.board)) throw schemaError('menu','missing_board_array');
              const rows = result.data.board;
              const byNo = new Map();
              for (const row of rows) {
                const no = String(first(row, ['bbsNo', 'bbs_no', 'boardNo', 'board_no']) || '');
                const name = safeText(first(row, ['name', 'title', 'boardName', 'board_name']), 120);
                if (no && name) byNo.set(no, name);
              }
              const value = { rows, byNo, source: result.url };
              menuCache.set(key, { at: Date.now(), value });
              if (menuCache.size > 120) {
                const oldest = [...menuCache.entries()].sort((a,b) => a[1].at - b[1].at)[0];
                if (oldest) menuCache.delete(oldest[0]);
              }
              return value;
            } catch (error) {
              return { rows: [], byNo: new Map(), source: '', error: String(error && error.message || error) };
            }
          }

          function normalizeVod'''
          crew, count = old_pattern.subn(replacement, crew, count=1)
          if count != 1:
              raise SystemExit('fetchMenu block not found exactly once')

          marker = "  fetchVodDetail,\n  verifyPublicPost,"
          insert = "  fetchVodDetail,\n  fetchMenu,\n  MENU_CACHE_TTL_MS,\n  clearMenuCacheForTest,\n  verifyPublicPost,"
          if marker not in crew:
              raise SystemExit('internals export marker not found')
          crew = crew.replace(marker, insert, 1)
          crew_path.write_text(crew)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify full suite
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps-script/Code.gs internal/crew-news.js tests
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'perf: reduce crew polling request volume'
          git push origin HEAD:perf/crew-poll-cost-20261004
