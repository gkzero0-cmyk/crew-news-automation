name: Apply crew-news audit followups

on:
  push:
    branches:
      - fix/crew-news-audit-followups
    paths:
      - .github/workflows/apply-audit-followups.yml

permissions:
  contents: write

jobs:
  red-green-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crew-news-audit-followups
          fetch-depth: 0

      - name: Verify regression is red before production change
        shell: bash
        run: |
          set +e
          node tests/crew-news-audit-followups.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected new regression to fail before the patch, but it passed."
            exit 1
          fi
          echo "Regression failed as expected before the patch."

      - name: Patch retrospective filtering and same-event matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('api/crew-news-batch.js')
          text = path.read_text(encoding='utf-8')

          old_same = r'''function sameRepresentativeActivity(a, b) {
            if (!a || !b) return false;
            const aActivity = normalize(a.strictActivity || a.displaySummary || '');
            const bActivity = normalize(b.strictActivity || b.displaySummary || '');
            if (!aActivity || !bActivity || aActivity !== bActivity) return false;

            const aDate = String(a.activityDate || '').slice(0,10);
            const bDate = String(b.activityDate || '').slice(0,10);
            return !aDate || !bDate || aDate === bDate;
          }'''
          new_same = r'''function sameRepresentativeActivity(a, b) {
            if (!a || !b) return false;
            const aRawActivity = String(a.strictActivity || a.displaySummary || '');
            const bRawActivity = String(b.strictActivity || b.displaySummary || '');
            const aActivity = normalize(aRawActivity);
            const bActivity = normalize(bRawActivity);
            if (!aActivity || !bActivity) return false;

            const aDate = String(a.activityDate || '').slice(0,10);
            const bDate = String(b.activityDate || '').slice(0,10);
            const sameDate = !aDate || !bDate || aDate === bDate;
            if (!sameDate) return false;
            if (aActivity === bActivity) return true;

            // Broader equivalence is only safe when both candidates have a concrete
            // matching date. It prevents a later generic member description from
            // replacing the stronger representative of the same crew event.
            if (!aDate || !bDate) return false;

            const aFamily = activityFamily(aRawActivity);
            const bFamily = activityFamily(bRawActivity);
            if (aFamily && aFamily === bFamily && aFamily === 'contest') return true;

            const genericPair = new Set([aActivity, bActivity]);
            if (genericPair.size === 2 && genericPair.has('콘텐츠') && genericPair.has('합방')) return true;

            return false;
          }'''
          if old_same not in text:
              raise SystemExit('sameRepresentativeActivity block not found')
          text = text.replace(old_same, new_same, 1)

          marker = 'function deriveCompetitiveDisplaySummary(sourceTitle = \'\', crew = \'\', activity = \'\') {'
          helper = r'''function isRetrospectiveActivityPost(raw = '') {
            const text = String(raw || '').replace(/\s+/g, ' ');
            const completionCue = /(?:한국\s*도착|집에\s*(?:갑|가|왔|도착)|다녀왔|여행(?:이|은|을)?[^.!?\n]{0,40}(?:끝|마무리|오랜만|좋았|즐거웠))/i;
            const followupCue = /(?:오늘|내일|모레)?[^.!?\n]{0,30}(?:후기|썰|리뷰)(?:\s*(?:뱅|방송))?/i;
            return completionCue.test(text) && followupCue.test(text);
          }

          '''
          if marker not in text:
              raise SystemExit('deriveCompetitiveDisplaySummary marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_context = "  const downstreamOnly = /(?:후기|결과|정산|당첨|상품|경품|배송|수령|보상|감사합니다|잘\\s*다녀왔)/i.test(activityText) && !confirmedSchedule;\n  const contextualActivity = (conditionalOrAspirational && !confirmedSchedule) || downstreamOnly ? '' : detectedActivity;"
          new_context = "  const downstreamOnly = /(?:후기|결과|정산|당첨|상품|경품|배송|수령|보상|감사합니다|잘\\s*다녀왔)/i.test(activityText) && !confirmedSchedule;\n  const retrospectiveOnly = detectedActivity === '여행' && isRetrospectiveActivityPost(activityText);\n  const contextualActivity = (conditionalOrAspirational && !confirmedSchedule) || downstreamOnly || retrospectiveOnly ? '' : detectedActivity;"
          if old_context not in text:
              raise SystemExit('strictCrewPost contextual activity block not found')
          text = text.replace(old_context, new_context, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted regressions are green
        run: |
          node tests/representative-selection-regression.test.js
          node tests/crew-news-audit-followups.test.js

      - name: Commit tested production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/crew-news-batch.js
          git commit -m 'fix: preserve same-event representatives and ignore trip followups'
          git push origin HEAD:fix/crew-news-audit-followups
