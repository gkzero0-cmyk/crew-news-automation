name: Tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test

      - name: Temporary image relevance audit
        if: always()
        run: |
          node - <<'NODE'
          (async()=>{
            const sharp=require('sharp');
            const names=[
              ['zzam_candidate','https://stimg.sooplive.com/NORMAL_BBS/8/25819298/35631791973160029.jpeg']
            ];
            for(const [key,image] of names){
              const u='https://crew-news-automation.vercel.app/api/image?url='+encodeURIComponent(image)+'&fit=sheet';
              try{
                const r=await fetch(u,{signal:AbortSignal.timeout(17000)});
                const buff=Buffer.from(await r.arrayBuffer());
                if(!r.ok||!String(r.headers.get('content-type')||'').startsWith('image/')){
                  console.log('CREW_IMAGE_META',JSON.stringify({key,status:r.status,type:r.headers.get('content-type'),bytes:buff.length}));
                  continue;
                }
                const original=await sharp(buff).metadata();
                const thumb=await sharp(buff).rotate().resize({width:620,height:500,fit:'inside',withoutEnlargement:true}).jpeg({quality:65}).toBuffer();
                const b64=thumb.toString('base64');
                console.log('CREW_IMAGE_META',JSON.stringify({key,status:r.status,bytes:buff.length,width:original.width,height:original.height,type:original.format,b64len:b64.length}));
                for(let i=0;i<b64.length;i+=2500)console.log('CREW_IMAGE_CHUNK',key,Math.floor(i/2500),b64.slice(i,i+2500));
              }catch(e){console.log('CREW_IMAGE_META',JSON.stringify({key,error:String(e.message||e)}))}
            }
            try {
              const u='https://crew-news-automation.vercel.app/api/crew-news?station=iamquaddurup&mode=vods&per_page=60';
              const rr=await fetch(u,{signal:AbortSignal.timeout(14000)});
              const data=await rr.json();
              const vods=(data.vods||[]).filter(v=>String(v.publishedAt||'').slice(0,10)>='2026-10-03'&&String(v.publishedAt||'').slice(0,10)<='2026-10-06').slice(0,25);
              console.log('CREW_JANG_VODS',JSON.stringify({http:rr.status,vods:vods.map(v=>({
                id:v.id,title:v.title,publishedAt:v.publishedAt,
                imageUrl:String(v.imageUrl||'').slice(0,200),vodUrl:v.vodUrl
              }))}));
            }catch(e){console.log('CREW_JANG_VODS',String(e.message||e))}
            try {
              const url='https://crew-news-automation.vercel.app/api/crew-news-batch?crew='+encodeURIComponent('ZZAM지트')+'&stations=yeonwoonayng,sagesv,zzamta0310,lllucen,hamssotta&per_page=35';
              const res=await fetch(url,{signal:AbortSignal.timeout(45000)});
              const data=await res.json();
              const selected=data.selected||{};
              console.log('CREW_BATCH_SELECTED',JSON.stringify({http:res.status,crew:data.strictCrew,version:data.policyVersion,source:selected.id,summary:selected.summary,displaySummary:selected.displaySummary,displayText:selected.displayText,activityDate:selected.activityDate,imageUrl:selected.imageUrl,imageSource:selected.imageSource,imagePostId:selected.imagePostId,reason:selected.imageSelectionReason,rawCandidateCount:data.rawCandidateCount,results:(data.results||[]).map(p=>({station:p.station,count:p.count,rawCount:p.rawCount}))}));
            }catch(e){console.log('CREW_BATCH_SELECTED',JSON.stringify({error:String(e.message||e)}));}
            const watch=[
              ['jo','yjkim5500','2026-10-15'],['jo2','muse0116','2026-10-15'],
              ['jin','ttobeherored','2026-10-13'],['jin2','jangjh5409','2026-10-13'],
              ['cheonta','doormomo','2026-10-15'],['cheonta2','243000','2026-10-15'],
              ['cheonta3','plincess','2026-10-15'],['zzam','yeonwoonayng','2026-10-14'],
              ['zzam2','sagesv','2026-10-14'],['meori','myang0315','2026-10-12'],
              ['meori2','beemong','2026-10-12'],['jara','dotcha','2026-10-13'],
              ['gang','hwayang3','2026-10-01'],['jang','iamquaddurup','2026-10-05']
            ];
            for(const [crew,station,date] of watch){
              try{
                const url='https://crew-news-automation.vercel.app/api/crew-news?station='+station+'&per_page=50';
                const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
                const d=await r.json();
                const same=(d.posts||[]).filter(p=>String(p.publishedAt||'').slice(0,10)>=date && String(p.publishedAt||'').slice(0,10)<=date).slice(0,15);
                const images=same.filter(p=>p.imageUrl||p.imageCandidateCount>0).map(p=>({
                  id:p.id,title:String(p.originalTitle||p.title||'').slice(0,100),
                  date:p.publishedAt,imageUrl:String(p.imageUrl||'').slice(0,230),
                  ambiguous:p.imageAmbiguous,count:p.imageCandidateCount,
                  content:String(p.contents||'').replace(/\s+/g,' ').slice(0,170)
                }));
                console.log('CREW_IMAGE_CANDIDATES',JSON.stringify({crew,station,date,http:r.status,count:same.length,images}));
              }catch(e){console.log('CREW_IMAGE_CANDIDATES',JSON.stringify({crew,station,error:String(e.message||e)}));}
            }
          })();
          NODE
