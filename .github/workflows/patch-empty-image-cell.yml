name: Patch empty image cell

on:
  push:
    branches:
      - fix/crew-news-empty-image-cell-20261004

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply empty image cell patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crew-news-empty-image-cell-20261004
      - name: Patch Apps Script source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps-script/Code.gs')
          s = p.read_text()
          s = s.replace("SCRIPT_VERSION: 'crew-apps-script-v1.7.0'", "SCRIPT_VERSION: 'crew-apps-script-v1.7.1'", 1)
          old = """  const expectedImage = String(selected.sheetImageUrl || '');\n  // 서버가 새 이미지를 검증한 경우에만 이미지 교체.\n  // 이미지가 없거나 VOD 검증이 실패했다고 기존 정상 이미지를 지우지 않는다.\n  const imageMatches = expectedImage\n    ? currentFormula.indexOf(expectedImage) !== -1\n    : true;"""
          new = """  const expectedImage = String(selected.sheetImageUrl || '');\n  const clearImage = isBlankImageDirective_(selected);\n  // blank-image는 실제 대표 이미지가 아니라 '이미지 셀을 비우라'는 명시적 지시다.\n  // 정상 이미지가 있으면 URL 일치 여부를 확인하고, clear 지시라면 수식이 없어야 일치한다.\n  const imageMatches = clearImage\n    ? !currentFormula\n    : (expectedImage ? currentFormula.indexOf(expectedImage) !== -1 : true);"""
          if old not in s:
              raise SystemExit('expected image block not found')
          s = s.replace(old, new, 1)
          old = """  if (expectedImage && !imageMatches) {\n    writeCrewImage_(mainSheet, crew, selected);\n  }"""
          new = """  if (clearImage && currentFormula) {\n    clearCrewImage_(mainSheet, crew);\n  } else if (expectedImage && !imageMatches) {\n    writeCrewImage_(mainSheet, crew, selected);\n  }"""
          if old not in s:
              raise SystemExit('image write block not found')
          s = s.replace(old, new, 1)
          s = s.replace("imageState: expectedImage ? '유지(쓰기 생략)' : (currentFormula ? '기존 이미지 유지' : '이미지 없음'),",
                        "imageState: clearImage ? '이미지 없음(셀 비움)' : (expectedImage ? '유지(쓰기 생략)' : (currentFormula ? '기존 이미지 유지' : '이미지 없음')),", 2)
          old = """    imageState: expectedImage\n      ? (imageMatches ? '유지' : '갱신')\n      : (currentFormula ? '기존 이미지 유지' : '이미지 없음'),"""
          new = """    imageState: clearImage\n      ? (currentFormula ? '이미지 삭제' : '이미지 없음(셀 비움)')\n      : (expectedImage\n        ? (imageMatches ? '유지' : '갱신')\n        : (currentFormula ? '기존 이미지 유지' : '이미지 없음')),"""
          if old not in s:
              raise SystemExit('image state block not found')
          s = s.replace(old, new, 1)
          marker = """function normalizeUrl_(url) {\n\n  return String(url || '').trim().replace(/\\/$/, '');\n\n}\n\n"""
          helper = """function normalizeUrl_(url) {\n\n  return String(url || '').trim().replace(/\\/$/, '');\n\n}\n\nfunction isBlankImageDirective_(selected) {\n\n  const imageUrl = String(selected && selected.imageUrl || '').trim();\n\n  const sheetImageUrl = String(selected && selected.sheetImageUrl || '').trim();\n\n  return !imageUrl && /\\/api\\/blank-image(?:[?#]|$)/i.test(sheetImageUrl);\n\n}\n\n"""
          if marker not in s:
              raise SystemExit('normalizeUrl marker not found')
          s = s.replace(marker, helper, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps-script/Code.gs
          git commit -m "fix: clear image cells when no representative media exists"
          git push origin HEAD:fix/crew-news-empty-image-cell-20261004
