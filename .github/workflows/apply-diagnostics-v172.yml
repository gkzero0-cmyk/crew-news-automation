name: Apply diagnostics v1.7.2
on:
  push:
    branches:
      - feat/crew-diagnostics-v172-20261004
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crew-diagnostics-v172-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply diagnostics patch
        run: python scripts/apply-diagnostics-v172.py
      - name: Commit generated changes
        run: |
          git rm .github/workflows/apply-diagnostics-v172.yml scripts/apply-diagnostics-v172.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/event-enrichment.js api/crew-news-batch.js apps-script/Code.gs
          git commit -m "feat: add crew news diagnostic observability"
          git push origin HEAD:feat/crew-diagnostics-v172-20261004
