name: Apply diagnostics v18 patch

on:
  push:
    branches:
      - feat/crew-news-diagnostics-v18-20261004
    paths:
      - .github/workflows/apply-diagnostics-v18.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crew-news-diagnostics-v18-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch diagnostics implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          # Event enrichment: preserve representative author and evidence traits.
          replace_once('lib/event-enrichment.js',
          """    sourcePublishedAt:String(rep.publishedAt||''),\n    imageUrl:String(rep.imageUrl||''),""",
          """    sourcePublishedAt:String(rep.publishedAt||''),\n    author:String(rep.author||''),\n    official:Boolean(rep.official),\n    titleActivityExplicit:Boolean(rep.titleActivityExplicit),\n    imageUrl:String(rep.imageUrl||''),""")

          # Core: retain raw freshness diagnostics and evidence counts before result pruning.
          replace_once('internal/crew-news-batch-core.js',
          """        rawCount: rawPosts.length,\n        strictFiltered: Boolean(crew),""",
          """        rawCount: rawPosts.length,\n        latestRawPublishedAt: rawPosts.reduce((latest, post) => {\n          const value = String(post && post.publishedAt || '');\n          return value > latest ? value : latest;\n        }, ''),\n        strictFiltered: Boolean(crew),""")

          replace_once('internal/crew-news-batch-core.js',
          """    candidates.sort(compareRepresentativeCandidates);\n    selected = candidates[0] || null;\n\n    if (selected) {""",
          """    candidates.sort(compareRepresentativeCandidates);\n    selected = candidates[0] || null;\n\n    if (selected) {\n      const evidence = candidates.filter(candidate => sameRepresentativeActivity(selected, candidate));\n      const evidenceStations = new Set(evidence.map(candidate => String(candidate._station || candidate.station || '')).filter(Boolean));\n      selected = {\n        ...selected,\n        evidenceCount: Math.max(1, evidenceStations.size),\n        leaderEvidence: evidence.some(candidate => Boolean(candidate.isCrewLeader)),\n        officialEvidence: evidence.some(candidate => OFFICIAL_BOARD_RE.test(String(candidate.boardName || '')))\n      };\n    }\n\n    if (selected) {""")

          replace_once('internal/crew-news-batch-core.js',
          """  const degradedSources = results.filter(item => item && item.ok && item.metadataDegraded);\n  const reliableEmpty =""",
          """  const degradedSources = results.filter(item => item && item.ok && item.metadataDegraded);\n  const latestRawPublishedAt = results.reduce((latest, item) => {\n    const value = String(item && item.ok && item.latestRawPublishedAt || '');\n    return value > latest ? value : latest;\n  }, '');\n  const reliableEmpty =""")

          replace_once('internal/crew-news-batch-core.js',
          """    rawCandidateCount,\n    selectedFingerprint,""",
          """    rawCandidateCount,\n    latestRawPublishedAt,\n    selectedFingerprint,""")

          replace_once('internal/crew-news-batch-core.js',
          """      sourcePublishedAt: selected.sourcePublishedAt || selected.publishedAt,\n      activityDate: selected.activityDate || String(selected.publishedAt || '').slice(0, 10),""",
          """      sourcePublishedAt: selected.sourcePublishedAt || selected.publishedAt,\n      author: selected.author || '',\n      evidenceCount: Number(selected.evidenceCount || 1),\n      leaderEvidence: Boolean(selected.leaderEvidence || selected.isCrewLeader),\n      officialEvidence: Boolean(selected.officialEvidence),\n      titleActivityExplicit: Boolean(selected.titleActivityExplicit),\n      activityDate: selected.activityDate || String(selected.publishedAt || '').slice(0, 10),""")

          # Batch wrapper: human-readable selection/image diagnostics + stale/new-post flags + build SHA.
          replace_once('api/crew-news-batch.js',
          """function displayDate(iso='') {\n  const m=String(iso).match(/^\\d{4}-(\\d{2})-(\\d{2})$/);\n  return m ? `${Number(m[1])}/${Number(m[2])}` : '';\n}\n""",
          """function displayDate(iso='') {\n  const m=String(iso).match(/^\\d{4}-(\\d{2})-(\\d{2})$/);\n  return m ? `${Number(m[1])}/${Number(m[2])}` : '';\n}\n\nfunction imageReasonFor(source='', imageUrl='') {\n  const type=String(source||'');\n  if (!imageUrl || type==='none') return '적합 이미지 없음';\n  const labels={\n    post_self:'대표 게시글 첨부 이미지',\n    post_self_verified:'대표 게시글 재검증 이미지',\n    post_member:'같은 이벤트 크루원 게시글 이미지',\n    leader_vod_same_day:'같은 날짜 크루장 VOD 이미지',\n    leader_vod:'관련 크루장 VOD 이미지',\n    member_vod:'관련 크루원 VOD 이미지'\n  };\n  return labels[type] || '검증된 대표 이미지';\n}\n\nfunction selectionReasonFor(selected={}) {\n  if (selected.selectionReason) return String(selected.selectionReason);\n  const evidence=Math.max(1,Number(selected.evidenceCount||1));\n  const leaderEvidence=Boolean(selected.leaderEvidence||selected.isCrewLeader);\n  if (evidence>=2 && leaderEvidence) return '수장 포함 복수 근거';\n  if (evidence>=2) return '복수 크루원 동일 이벤트';\n  if (selected.isCrewLeader && selected.officialEvidence) return '크루장 공식 공지';\n  if (selected.isCrewLeader) return '크루장 대표 활동';\n  if (selected.titleActivityExplicit) return '이벤트 제목 직접 일치';\n  return '크루원 검증 활동';\n}\n\nfunction ageDaysFor(activityDate='', nowMs=Date.now()) {\n  const match=String(activityDate||'').match(/^(20\\d{2})-(\\d{2})-(\\d{2})/);\n  if (!match) return null;\n  const dayMs=Date.parse(`${match[1]}-${match[2]}-${match[3]}T00:00:00+09:00`);\n  if (!Number.isFinite(dayMs)) return null;\n  return Math.max(0,Math.floor((Number(nowMs)-dayMs)/86400000));\n}\n\nfunction annotatePayloadDiagnostics(payload, nowMs=Date.now()) {\n  if (!payload || typeof payload!=='object') return payload;\n  const out={...payload,buildSha:String(payload.buildSha||process.env.VERCEL_GIT_COMMIT_SHA||'').trim()};\n  if (!out.selected) {\n    out.noNewsDiagnostic=Number(out.rawCandidateCount||0)>0\n      ? '새 글 있음 / 허용 후보 없음'\n      : '새 게시글 없음';\n    return out;\n  }\n  const selected={...out.selected};\n  selected.evidenceCount=Math.max(1,Number(selected.evidenceCount||1));\n  selected.leaderEvidence=Boolean(selected.leaderEvidence||selected.isCrewLeader);\n  selected.officialEvidence=Boolean(selected.officialEvidence);\n  selected.selectionReason=selectionReasonFor(selected);\n  selected.imageReason=imageReasonFor(selected.imageSource,selected.imageUrl);\n  selected.latestRawPublishedAt=String(out.latestRawPublishedAt||selected.sourcePublishedAt||selected.publishedAt||'');\n  const days=ageDaysFor(selected.activityDate||selected.sourcePublishedAt,nowMs);\n  selected.ageDays=days;\n  selected.staleStatus=days==null ? '' : days>=14 ? '오래된 소식 14일+' : days>=7 ? '오래된 소식 7일+' : '정상';\n  const latestRawMs=Date.parse(String(selected.latestRawPublishedAt||'').replace(' ','T')+'+09:00')||0;\n  const selectedMs=Date.parse(String(selected.sourcePublishedAt||selected.publishedAt||'').replace(' ','T')+'+09:00')||0;\n  selected.newPostsDiagnostic=latestRawMs>selectedMs\n    ? '새 글 있음 / 크루소식 후보 제외'\n    : '최신 크루소식과 동기';\n  out.selected=selected;\n  return out;\n}\n""")

          replace_once('api/crew-news-batch.js',
          """function buildSelected(crew,event,fingerprint) {\n  const date=displayDate(event.activityDate);\n  return {""",
          """function buildSelected(crew,event,fingerprint) {\n  const date=displayDate(event.activityDate);\n  const cluster=Array.isArray(event._clusterPosts)?event._clusterPosts:[];\n  const evidenceStations=new Set(cluster.map(row=>String(row&&row.station||'')).filter(Boolean));\n  const evidenceCount=Math.max(1,evidenceStations.size);\n  const leaderEvidence=cluster.some(row=>Boolean(row&&row.leader)) || Boolean(event.isCrewLeader);\n  const officialEvidence=cluster.some(row=>Boolean(row&&row.official)) || Boolean(event.official);\n  const diagnosticBase={\n    evidenceCount,\n    leaderEvidence,\n    officialEvidence,\n    isCrewLeader:Boolean(event.isCrewLeader),\n    titleActivityExplicit:Boolean(event.titleActivityExplicit)\n  };\n  return {""")

          replace_once('api/crew-news-batch.js',
          """    sourcePublishedAt:event.sourcePublishedAt||event.publishedAt,\n    activityDate:event.activityDate,""",
          """    sourcePublishedAt:event.sourcePublishedAt||event.publishedAt,\n    author:String(event.author||''),\n    evidenceCount,\n    leaderEvidence,\n    officialEvidence,\n    titleActivityExplicit:Boolean(event.titleActivityExplicit),\n    selectionReason:selectionReasonFor(diagnosticBase),\n    activityDate:event.activityDate,""")

          replace_once('api/crew-news-batch.js',
          """    imageSource:event.imageSource||'none',\n    imagePostId:event.imagePostId||'',""",
          """    imageSource:event.imageSource||'none',\n    imageReason:imageReasonFor(event.imageSource||'none',event.imageUrl||''),\n    imagePostId:event.imagePostId||'',""")

          replace_once('api/crew-news-batch.js',
          """  res.setHeader('X-Crew-News-Policy',POLICY_VERSION);\n  res.setHeader('X-Crew-News-Enrichment','event-cluster-v1');\n  return res.status(captured.state.statusCode).json(body);""",
          """  body=annotatePayloadDiagnostics(body);\n  res.setHeader('X-Crew-News-Policy',POLICY_VERSION);\n  res.setHeader('X-Crew-News-Enrichment','event-cluster-v1');\n  return res.status(captured.state.statusCode).json(body);""")

          replace_once('api/crew-news-batch.js',
          """  buildSelected,\n  clearInvalidSelection,""",
          """  buildSelected,\n  imageReasonFor,\n  selectionReasonFor,\n  ageDaysFor,\n  annotatePayloadDiagnostics,\n  clearInvalidSelection,""")

          # Apps Script v1.8 status columns.
          replace_once('apps-script/Code.gs',
          "SCRIPT_VERSION: 'crew-apps-script-v1.7.1'",
          "SCRIPT_VERSION: 'crew-apps-script-v1.8.0'")

          replace_once('apps-script/Code.gs',
          """  const serverPolicy = String(payload && payload.policyVersion || '').trim();""",
          """  const serverBuildSha = String(payload && payload.buildSha || '').trim();\n  const rawServerPolicy = String(payload && payload.policyVersion || '').trim();\n  const serverPolicy = rawServerPolicy + (serverBuildSha ? ' @ ' + serverBuildSha.slice(0, 8) : '');""")

          diag_func="""\nfunction statusDiagnosticsFromPayload_(payload, selected) {\n  const value = selected || {};\n  return {\n    selectionReason: String(value.selectionReason || ''),\n    imageReason: String(value.imageReason || ''),\n    evidenceCount: Number(value.evidenceCount || 0),\n    leaderEvidence: Boolean(value.leaderEvidence),\n    newPostsDiagnostic: String(value.newPostsDiagnostic || (payload && payload.noNewsDiagnostic) || ''),\n    staleStatus: String(value.staleStatus || ''),\n    ageDays: value.ageDays == null ? '' : Number(value.ageDays),\n    latestRawPublishedAt: String(value.latestRawPublishedAt || (payload && payload.latestRawPublishedAt) || '')\n  };\n}\n\nfunction buildStatusDiagnosticValues_(result, old) {\n  const previous = Array.isArray(old) ? old : [];\n  const has = function(key) { return Object.prototype.hasOwnProperty.call(result, key); };\n  const diagnostics = result && result.diagnostics ? result.diagnostics : (result || {});\n  const hasDiag = function(key) { return Object.prototype.hasOwnProperty.call(diagnostics, key); };\n  const checked = formatStatusDate_(result.checkedAt || new Date());\n  const success = result.successAt ? formatStatusDate_(result.successAt) : (previous[2] || '');\n  return [\n    result.crew, checked, success,\n    has('author') ? result.author : (previous[3] || ''),\n    has('publishedAt') ? result.publishedAt : (previous[4] || ''),\n    has('newsText') ? result.newsText : (previous[5] || ''),\n    has('postUrl') ? result.postUrl : (previous[6] || ''),\n    has('imageUrl') ? result.imageUrl : (previous[7] || ''),\n    result.imageState || '', result.error || '', result.sourceType || '', '10분',\n    has('fingerprint') ? result.fingerprint : (previous[12] || ''),\n    has('writeAction') ? result.writeAction : (previous[13] || ''),\n    has('healthStatus') ? result.healthStatus : (previous[14] || ''),\n    hasDiag('selectionReason') ? diagnostics.selectionReason : (previous[15] || ''),\n    hasDiag('imageReason') ? diagnostics.imageReason : (previous[16] || ''),\n    hasDiag('evidenceCount') ? diagnostics.evidenceCount : (previous[17] || ''),\n    hasDiag('leaderEvidence') ? (diagnostics.leaderEvidence ? 'O' : 'X') : (previous[18] || ''),\n    hasDiag('newPostsDiagnostic') ? diagnostics.newPostsDiagnostic : (previous[19] || ''),\n    hasDiag('staleStatus') ? diagnostics.staleStatus : (previous[20] || ''),\n    hasDiag('ageDays') ? diagnostics.ageDays : (previous[21] || ''),\n    hasDiag('latestRawPublishedAt') ? diagnostics.latestRawPublishedAt : (previous[22] || '')\n  ];\n}\n"""
          replace_once('apps-script/Code.gs',
          """function ensureStatusDiagnosticsColumns_(sheet) {""",
          diag_func+"\nfunction ensureStatusDiagnosticsColumns_(sheet) {")

          replace_once('apps-script/Code.gs',
          """  const requiredColumns = 15;""",
          """  const requiredColumns = 23;""")

          replace_once('apps-script/Code.gs',
          """  if (!matches) {\n    sheet.getRange(1, 12).copyTo(headerRange, SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false);\n    headerRange.setValues([expected]);\n  }\n}""",
          """  if (!matches) {\n    sheet.getRange(1, 12).copyTo(headerRange, SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false);\n    headerRange.setValues([expected]);\n  }\n\n  const diagnosticHeaders = ['대표선정이유','이미지선정이유','근거수','수장근거','신규글진단','소식상태','경과일','최신원문일'];\n  const diagnosticRange = sheet.getRange(1, 16, 1, 8);\n  const diagnosticCurrent = diagnosticRange.getDisplayValues()[0];\n  const diagnosticsMatch = diagnosticHeaders.every(function(value, index) { return diagnosticCurrent[index] === value; });\n  if (!diagnosticsMatch) {\n    sheet.getRange(1, 12).copyTo(diagnosticRange, SpreadsheetApp.CopyPasteType.PASTE_FORMAT, false);\n    diagnosticRange.setValues([diagnosticHeaders]);\n  }\n}""")

          old_block="""    const old = sheet.getRange(row, 1, 1, 15).getValues()[0];\n\n    const checked = formatStatusDate_(result.checkedAt || new Date());\n\n    const success = result.successAt ? formatStatusDate_(result.successAt) : (old[2] || '');\n\n    const has = function(key) { return Object.prototype.hasOwnProperty.call(result, key); };\n\n\n\n    sheet.getRange(row, 1, 1, 15).setValues([[\n\n      result.crew,\n\n      checked,\n\n      success,\n\n      has('author') ? result.author : (old[3] || ''),\n\n      has('publishedAt') ? result.publishedAt : (old[4] || ''),\n\n      has('newsText') ? result.newsText : (old[5] || ''),\n\n      has('postUrl') ? result.postUrl : (old[6] || ''),\n\n      has('imageUrl') ? result.imageUrl : (old[7] || ''),\n\n      result.imageState || '',\n\n      result.error || '',\n\n      result.sourceType || '',\n\n      '10분',\n\n      has('fingerprint') ? result.fingerprint : (old[12] || ''),\n\n      has('writeAction') ? result.writeAction : (old[13] || ''),\n\n      has('healthStatus') ? result.healthStatus : (old[14] || '')\n\n    ]]);"""
          new_block="""    const old = sheet.getRange(row, 1, 1, 23).getValues()[0];\n    sheet.getRange(row, 1, 1, 23).setValues([[...buildStatusDiagnosticValues_(result, old)]]);"""
          replace_once('apps-script/Code.gs', old_block, new_block)

          # Add diagnostic objects to the three successful selected-result return branches.
          marker="""      healthStatus: healthStatus\n    };"""
          replacement="""      healthStatus: healthStatus,\n      diagnostics: statusDiagnosticsFromPayload_(payload, selected)\n    };"""
          p=Path('apps-script/Code.gs')
          s=p.read_text()
          count=s.count(marker)
          if count < 3:
              raise SystemExit(f'apps-script selected return marker expected >=3, found {count}')
          # Only replace the last three selected-result occurrences; preserve failure/no-news branches.
          parts=s.rsplit(marker,3)
          s=replacement.join(parts)
          p.write_text(s)

          # Reliable-empty branch gets no-news diagnostics too.
          replace_once('apps-script/Code.gs',
          """      serverPolicy: serverPolicy,\n      healthStatus: healthStatus\n    };\n  }\n\n  // 핵심: 날짜/제목/활동을 Apps Script에서 다시 계산하지 않는다.""",
          """      serverPolicy: serverPolicy,\n      healthStatus: healthStatus,\n      diagnostics: statusDiagnosticsFromPayload_(payload, null)\n    };\n  }\n\n  // 핵심: 날짜/제목/활동을 Apps Script에서 다시 계산하지 않는다.""")

          # Existing version regression must track the new script version.
          replace_once('tests/apps-script-diagnostics.test.js',
          """assert.equal(cells.ScriptVersion, 'crew-apps-script-v1.7.1');""",
          """assert.equal(cells.ScriptVersion, 'crew-apps-script-v1.8.0');""")
          PY
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-diagnostics-v18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add explainable crew-news diagnostics"
          git push origin HEAD:feat/crew-news-diagnostics-v18-20261004
