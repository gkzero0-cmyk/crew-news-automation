name: Apply editorial policy patch

on:
  push:
    branches:
      - fix/crew-editorial-policy

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[policy-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crew-editorial-policy
      - name: Preserve truthful external-participation title
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('internal/crew-news-batch-core.js')
          text = path.read_text()
          old = "  const displaySummary = manualDisplay || (normalize(summary).includes(crewToken) ? summary : crew + ' ' + summary);"
          new = "  const displaySummary = manualDisplay || externalParticipationSummary || (normalize(summary).includes(crewToken) ? summary : crew + ' ' + summary);"
          if old not in text:
            if new in text:
              raise SystemExit(0)
            raise SystemExit('displaySummary block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/crew-news-batch-core.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve external host in crew news title [policy-patch]"
          git push origin HEAD:fix/crew-editorial-policy
