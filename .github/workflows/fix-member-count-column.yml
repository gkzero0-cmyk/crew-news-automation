name: Apply member-count column fix

on:
  push:
    branches:
      - fix/member-count-column-20261004

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/member-count-column-20261004
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps-script/Code.gs')
          s = p.read_text()
          old = "mainSheet.getRange(1, 1, lastRow, 1).getDisplayValues()"
          new = "mainSheet.getRange(1, 2, lastRow, 1).getDisplayValues()"
          if old not in s:
              raise SystemExit('expected column-A validation read not found')
          s = s.replace(old, new, 1)
          s = s.replace("SCRIPT_VERSION: 'crew-apps-script-v1.7.6'", "SCRIPT_VERSION: 'crew-apps-script-v1.7.7'", 1)
          p.write_text(s)

          t = Path('tests/sheet-ops-improvements.test.js')
          q = t.read_text()
          q = q.replace("crew-apps-script-v1\\.7\\.6", "crew-apps-script-v1\\.7\\.7", 1)
          t.write_text(q)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs tests/sheet-ops-improvements.test.js
          git commit -m "fix: read member counts from crew header column"
          git push origin HEAD:fix/member-count-column-20261004
