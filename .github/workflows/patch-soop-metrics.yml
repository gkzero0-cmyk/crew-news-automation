name: Apply SOOP request telemetry

on:
  push:
    branches:
      - 'perf/soop-request-metrics-20261004'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/soop-request-metrics-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply telemetry implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # ---- internal/crew-news.js ----
          path = Path('internal/crew-news.js')
          text = path.read_text()
          marker = """const BROWSER_HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36',
            'Accept': 'application/json,text/plain,*/*',
            'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7'
          };

          function safeStation"""
          metrics_block = """const BROWSER_HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36',
            'Accept': 'application/json,text/plain,*/*',
            'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7'
          };

          const SOOP_METRIC_FIELDS = Object.freeze([
            'totalRequests',
            'boardRequests',
            'menuRequests',
            'menuCacheHits',
            'menuCacheMisses',
            'vodListRequests',
            'postVerifyRequests',
            'postVerifyCacheHits',
            'vodDetailRequests'
          ]);

          function createSoopRequestMetrics() {
            return Object.fromEntries(SOOP_METRIC_FIELDS.map(key => [key, 0]));
          }

          function ensureSoopRequestMetrics(req) {
            if (!req || typeof req !== 'object') return createSoopRequestMetrics();
            if (!req._soopMetrics || typeof req._soopMetrics !== 'object') {
              req._soopMetrics = createSoopRequestMetrics();
            }
            return req._soopMetrics;
          }

          function bumpSoopMetric(metrics, key, amount = 1) {
            if (!metrics || !SOOP_METRIC_FIELDS.includes(key)) return;
            const delta = Number(amount);
            metrics[key] = Number(metrics[key] || 0) + (Number.isFinite(delta) ? delta : 0);
          }

          function countSoopUpstream(metrics, key) {
            bumpSoopMetric(metrics, 'totalRequests', 1);
            if (key) bumpSoopMetric(metrics, key, 1);
          }

          function snapshotSoopRequestMetrics(metrics) {
            const source = metrics && typeof metrics === 'object' ? metrics : {};
            return Object.fromEntries(SOOP_METRIC_FIELDS.map(key => [key, Number(source[key] || 0)]));
          }

          function safeStation"""
          text = replace_once(text, marker, metrics_block, 'metrics block')

          text = replace_once(
              text,
              "async function fetchJson(url, headers = {}, timeoutMs = 10000) {\n  const controller = new AbortController();",
              "async function fetchJson(url, headers = {}, timeoutMs = 10000, metrics = null, metricField = '') {\n  countSoopUpstream(metrics, metricField);\n  const controller = new AbortController();",
              'fetchJson signature')
          text = replace_once(
              text,
              "async function firstJson(urls, headers) {\n  const errors = [];",
              "async function firstJson(urls, headers, metrics = null, metricField = '') {\n  const errors = [];",
              'firstJson signature')
          text = replace_once(
              text,
              "return await fetchJson(url, headers);",
              "return await fetchJson(url, headers, 10000, metrics, metricField);",
              'firstJson fetch')

          text = replace_once(
              text,
              "if (!safeId) throw new Error('invalid_post_id');\n  const key = String(station) + '|' + safeId;",
              "if (!safeId) throw new Error('invalid_post_id');\n  const metrics = ensureSoopRequestMetrics(req);\n  const key = String(station) + '|' + safeId;",
              'verify metrics')
          text = replace_once(
              text,
              "if (Date.now() - cached.at < ttl) return cached.value;",
              "if (Date.now() - cached.at < ttl) {\n      bumpSoopMetric(metrics, 'postVerifyCacheHits', 1);\n      return cached.value;\n    }",
              'verify cache hit')
          text = replace_once(
              text,
              "try {\n    const response = await fetch(url, {\n      redirect:'follow',",
              "try {\n    countSoopUpstream(metrics, 'postVerifyRequests');\n    const response = await fetch(url, {\n      redirect:'follow',",
              'verify request count')

          text = replace_once(
              text,
              "if (!id) throw new Error('invalid_vod_id');\n  const controller = new AbortController();",
              "if (!id) throw new Error('invalid_vod_id');\n  const metrics = ensureSoopRequestMetrics(req);\n  countSoopUpstream(metrics, 'vodDetailRequests');\n  const controller = new AbortController();",
              'vod detail metrics')

          text = replace_once(text, "async function fetchMenu(station, headers) {", "async function fetchMenu(station, headers, metrics = null) {", 'fetchMenu signature')
          text = replace_once(
              text,
              "if (cached && Date.now() - cached.at < MENU_CACHE_TTL_MS) return cached.value;\n  if (cached) menuCache.delete(key);",
              "if (cached && Date.now() - cached.at < MENU_CACHE_TTL_MS) {\n    bumpSoopMetric(metrics, 'menuCacheHits', 1);\n    return cached.value;\n  }\n  if (cached) menuCache.delete(key);\n  bumpSoopMetric(metrics, 'menuCacheMisses', 1);",
              'menu hit miss')
          text = replace_once(
              text,
              "const result = await firstJson(urls, headers);\n    if (!result.data || !Array.isArray(result.data.board))",
              "const result = await firstJson(urls, headers, metrics, 'menuRequests');\n    if (!result.data || !Array.isArray(result.data.board))",
              'menu request')

          text = replace_once(
              text,
              "async function fetchVodRows(station, {type='review', page=1, perPage=12}={}) {",
              "async function fetchVodRows(station, {type='review', page=1, perPage=12}={}, metrics=null) {",
              'vod rows signature')
          text = replace_once(
              text,
              "const result = await firstJson(urls, {Referer:`https://www.sooplive.com/station/${station}/vod/${safeType}`});",
              "const result = await firstJson(urls, {Referer:`https://www.sooplive.com/station/${station}/vod/${safeType}`}, metrics, 'vodListRequests');",
              'vod list request')
          text = replace_once(
              text,
              "async function fetchVods(station, req, options={}) {\n  const rows = await fetchVodRows(station, options);",
              "async function fetchVods(station, req, options={}) {\n  const metrics = ensureSoopRequestMetrics(req);\n  const rows = await fetchVodRows(station, options, metrics);",
              'fetchVods metrics')

          text = replace_once(
              text,
              "const station = safeStation(requestUrl.searchParams.get('station') || '');\n  if (!station) return res.status(400).json({ error: 'invalid_station' });\n\n  if (mode === 'vod-detail') {",
              "const station = safeStation(requestUrl.searchParams.get('station') || '');\n  if (!station) return res.status(400).json({ error: 'invalid_station' });\n  const metrics = ensureSoopRequestMetrics(req);\n\n  if (mode === 'vod-detail') {",
              'handler metrics')
          text = replace_once(
              text,
              "const rows = await fetchVodRows(station, options);\n      const vods = rows.map",
              "const rows = await fetchVodRows(station, options, metrics);\n      const vods = rows.map",
              'handler vod metrics')
          text = replace_once(text, "const menu = await fetchMenu(station, headers);", "const menu = await fetchMenu(station, headers, metrics);", 'handler menu metrics')
          text = replace_once(
              text,
              "const result = await firstJson(urls, headers);\n    const rows = requireRows(result.data, 'board');",
              "const result = await firstJson(urls, headers, metrics, 'boardRequests');\n    const rows = requireRows(result.data, 'board');",
              'handler board metrics')

          text = replace_once(
              text,
              "module.exports._internals = {\n  safeStation,",
              "module.exports._internals = {\n  createSoopRequestMetrics,\n  ensureSoopRequestMetrics,\n  snapshotSoopRequestMetrics,\n  safeStation,",
              'exports metrics')
          path.write_text(text)

          # ---- internal/crew-news-batch-core.js ----
          path = Path('internal/crew-news-batch-core.js')
          text = path.read_text()
          text = replace_once(
              text,
              "headers\n  };\n  const fakeRes={",
              "headers,\n    _soopMetrics:req && req._soopMetrics || null\n  };\n  const fakeRes={",
              'batch fake req metrics')
          text = replace_once(
              text,
              "const stations = safeStations(requestUrl.searchParams.get('stations') || '');\n  if (!stations.length) return res.status(400).json({ error: 'invalid_stations' });\n\n  const perPage",
              "const stations = safeStations(requestUrl.searchParams.get('stations') || '');\n  if (!stations.length) return res.status(400).json({ error: 'invalid_stations' });\n\n  const soopMetrics = typeof crewNewsInternals.createSoopRequestMetrics === 'function'\n    ? crewNewsInternals.createSoopRequestMetrics()\n    : {};\n  req._soopMetrics = soopMetrics;\n  const snapshotSoopMetrics = () => typeof crewNewsInternals.snapshotSoopRequestMetrics === 'function'\n    ? crewNewsInternals.snapshotSoopRequestMetrics(soopMetrics)\n    : soopMetrics;\n\n  const perPage",
              'batch metrics init')
          text = replace_once(
              text,
              "healthStatus: 'degraded',\n      rawCandidateCount\n    });",
              "healthStatus: 'degraded',\n      rawCandidateCount,\n      soopMetrics: snapshotSoopMetrics()\n    });",
              'batch error metrics')
          text = replace_once(
              text,
              "policyVersion: POLICY_VERSION,\n    strictCrew: crew || '',",
              "policyVersion: POLICY_VERSION,\n    soopMetrics: snapshotSoopMetrics(),\n    strictCrew: crew || '',",
              'batch success metrics')
          path.write_text(text)

          # ---- api/crew-news-all.js ----
          path = Path('api/crew-news-all.js')
          text = path.read_text()
          text = replace_once(
              text,
              "const { POLICY_VERSION } = require('../lib/version.js');\n\nfunction clampInt",
              "const { POLICY_VERSION } = require('../lib/version.js');\n\nconst SOOP_METRIC_FIELDS = Object.freeze([\n  'totalRequests','boardRequests','menuRequests','menuCacheHits','menuCacheMisses',\n  'vodListRequests','postVerifyRequests','postVerifyCacheHits','vodDetailRequests'\n]);\n\nfunction aggregateSoopMetrics(batches) {\n  const out = Object.fromEntries(SOOP_METRIC_FIELDS.map(key => [key, 0]));\n  for (const batch of Array.isArray(batches) ? batches : []) {\n    const metrics = batch && batch.payload && batch.payload.soopMetrics || {};\n    for (const key of SOOP_METRIC_FIELDS) out[key] += Number(metrics[key] || 0);\n  }\n  return out;\n}\n\nfunction clampInt",
              'all metrics helper')
          text = replace_once(
              text,
              "fetchMode: 'single-batch-v1',\n    requestedCrews: crews.length,",
              "fetchMode: 'single-batch-v1',\n    soopMetrics: aggregateSoopMetrics(batches),\n    requestedCrews: crews.length,",
              'all response metrics')
          text = replace_once(
              text,
              "module.exports._internals = {\n  clampInt,",
              "module.exports._internals = {\n  aggregateSoopMetrics,\n  clampInt,",
              'all export metrics')
          path.write_text(text)

          # ---- apps-script/Code.gs ----
          path = Path('apps-script/Code.gs')
          text = path.read_text()
          text = text.replace("SCRIPT_VERSION: 'crew-apps-script-v1.7.3'", "SCRIPT_VERSION: 'crew-apps-script-v1.7.4'")
          text = replace_once(
              text,
              "const diagnostics = { batchRequests: 0, fallbackRequests: 0, batchReceived: false };",
              "const diagnostics = { batchRequests: 0, fallbackRequests: 0, batchReceived: false, soopMetrics: emptySoopMetrics_() };",
              'Apps diagnostics init')

          helper_marker = "function setAutomationState_(state, lastRun, diagnostics) {"
          helper_block = """function emptySoopMetrics_() {
            return {
              totalRequests: 0,
              boardRequests: 0,
              menuRequests: 0,
              menuCacheHits: 0,
              menuCacheMisses: 0,
              vodListRequests: 0,
              postVerifyRequests: 0,
              postVerifyCacheHits: 0,
              vodDetailRequests: 0
            };
          }

          function mergeSoopMetrics_(diagnostics, metrics) {
            if (!diagnostics || !metrics) return;
            if (!diagnostics.soopMetrics) diagnostics.soopMetrics = emptySoopMetrics_();
            Object.keys(diagnostics.soopMetrics).forEach(function(key) {
              diagnostics.soopMetrics[key] += Number(metrics[key] || 0);
            });
          }

          function setAutomationState_(state, lastRun, diagnostics) {"""
          text = replace_once(text, helper_marker, helper_block, 'Apps metrics helpers')

          old_status = """      sheet.getRange('A16:B22').setValues([
                ['FetchMode', fetchMode],
                ['ScriptVersion', CREW_AUTOMATION.SCRIPT_VERSION],
                ['APIBase', CREW_AUTOMATION.API_BASE],
                ['FetchRequestCount', diagnostics.batchRequests + diagnostics.fallbackRequests],
                ['FallbackRequestCount', diagnostics.fallbackRequests],
                ['RunCompletedAt', formatStatusDate_(lastRun)],
                ['RunOutcome', diagnostics.outcome]
              ]);"""
          new_status = """      sheet.getRange('A16:B22').setValues([
                ['FetchMode', fetchMode],
                ['ScriptVersion', CREW_AUTOMATION.SCRIPT_VERSION],
                ['APIBase', CREW_AUTOMATION.API_BASE],
                ['FetchRequestCount', diagnostics.batchRequests + diagnostics.fallbackRequests],
                ['FallbackRequestCount', diagnostics.fallbackRequests],
                ['RunCompletedAt', formatStatusDate_(lastRun)],
                ['RunOutcome', diagnostics.outcome]
              ]);
              const soop = diagnostics.soopMetrics || emptySoopMetrics_();
              sheet.getRange('D12:E20').setValues([
                ['SOOPTotalRequests', Number(soop.totalRequests || 0)],
                ['SOOPBoardRequests', Number(soop.boardRequests || 0)],
                ['SOOPMenuRequests', Number(soop.menuRequests || 0)],
                ['SOOPMenuCacheHits', Number(soop.menuCacheHits || 0)],
                ['SOOPMenuCacheMisses', Number(soop.menuCacheMisses || 0)],
                ['SOOPVodListRequests', Number(soop.vodListRequests || 0)],
                ['SOOPPostVerifyRequests', Number(soop.postVerifyRequests || 0)],
                ['SOOPPostVerifyCacheHits', Number(soop.postVerifyCacheHits || 0)],
                ['SOOPVodDetailRequests', Number(soop.vodDetailRequests || 0)]
              ]);"""
          text = replace_once(text, old_status, new_status, 'Apps status metrics')

          text = replace_once(
              text,
              "if (code < 200 || code >= 300 || !envelope || !Array.isArray(envelope.batches)) {\n    throw new Error('통합 크루 소식 API 오류 (' + code + ')');\n  }\n\n  const out = {};",
              "if (code < 200 || code >= 300 || !envelope || !Array.isArray(envelope.batches)) {\n    throw new Error('통합 크루 소식 API 오류 (' + code + ')');\n  }\n  mergeSoopMetrics_(diagnostics, envelope.soopMetrics);\n\n  const out = {};",
              'Apps all merge metrics')
          text = replace_once(
              text,
              "// 서버가 preservePrevious를 보낸 503도 정상적인 \"보존 신호\"로 전달한다.\n  if (code >= 500 && (!payload || (!payload.results && payload.preservePrevious !== true))) {",
              "mergeSoopMetrics_(diagnostics, payload && payload.soopMetrics);\n\n  // 서버가 preservePrevious를 보낸 503도 정상적인 \"보존 신호\"로 전달한다.\n  if (code >= 500 && (!payload || (!payload.results && payload.preservePrevious !== true))) {",
              'Apps fallback merge metrics')
          path.write_text(text)

          # Existing tests that pin the Apps Script version should move with the feature.
          for test_path in Path('tests').glob('*.test.js'):
              test_text = test_path.read_text()
              if 'crew-apps-script-v1.7.3' in test_text:
                  test_path.write_text(test_text.replace('crew-apps-script-v1.7.3', 'crew-apps-script-v1.7.4'))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify full suite
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/crew-news.js internal/crew-news-batch-core.js api/crew-news-all.js apps-script/Code.gs tests
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat: expose SOOP request telemetry'
          git push origin HEAD:perf/soop-request-metrics-20261004
