name: Jindugi trip anchor v2

on:
  push:
    branches:
      - fix/jindugi-trip-start-date
    paths:
      - .github/workflows/apply-jindugi-trip-anchor-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jindugi-trip-start-date
          fetch-depth: 0

      - name: Confirm new test fails before patch
        shell: bash
        run: |
          set +e
          node tests/crew-news-audit-followups.test.js
          code=$?
          set -e
          test "$code" -ne 0

      - name: Apply verified start date
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('api/crew-news-batch.js'); t=p.read_text(encoding='utf-8'); n=\"    '208395133': '2026-09-30'\"; assert n in t; p.write_text(t.replace(n, n+\",\\n    '208704035': '2026-09-30'\", 1), encoding='utf-8')"

      - name: Run targeted tests
        run: |
          node tests/representative-selection-regression.test.js
          node tests/crew-news-audit-followups.test.js

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/crew-news-batch.js
          git commit -m 'fix: anchor Jindugi trip updates to verified start date'
          git push origin HEAD:fix/jindugi-trip-start-date
