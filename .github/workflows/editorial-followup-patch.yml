name: Apply editorial follow-up patch

on:
  push:
    branches:
      - fix/crew-editorial-policy-followup

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[editorial-followup-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crew-editorial-policy-followup
      - name: Patch core and enrichment editorial filters
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('internal/crew-news-batch-core.js')
          core = core_path.read_text()
          old_core = """  const activityText = sourceTitle + '\\n' + body;\n  const externalApplication = /(?:콘텐츠|컨텐츠|대회|합방|팀)[^.!?\\n]{0,80}(?:지원(?:합니다|했|해|서|중)?|참가\\s*신청|신청(?:합니다|했|해|서|중)?|지원서)|(?:지원(?:합니다|했|해|서|중)?|참가\\s*신청|신청(?:합니다|했|해|서|중)?|지원서)[^.!?\\n]{0,80}(?:콘텐츠|컨텐츠|대회|합방|팀)/i.test(activityText);"""
          new_core = """  const activityText = sourceTitle + '\\n' + body;\n  const nonNewsMediaPost = /AI\\s*게시판/i.test(board) &&\n    /썸네일|다시보기|리플레이|하이라이트|클립|후기/i.test(activityText);\n  if (!override && nonNewsMediaPost) return null;\n\n  const externalApplication = /(?:콘텐츠|컨텐츠|대회|합방|팀)[^.!?\\n]{0,80}(?:지원(?:합니다|했|해|서|중)?|참가\\s*신청|신청(?:합니다|했|해|서|중)?|지원서)|(?:지원(?:합니다|했|해|서|중)?|참가\\s*신청|신청(?:합니다|했|해|서|중)?|지원서)[^.!?\\n]{0,80}(?:콘텐츠|컨텐츠|대회|합방|팀)/i.test(activityText);"""
          if old_core not in core:
            raise SystemExit('core activity marker not found')
          core = core.replace(old_core, new_core, 1)
          core = core.replace(
            "/(?:뉴|새|신규|new)?\\s*(?:오리지널\\s*)?(?:아바타|모델|의상)|신의상|리뉴얼\\s*(?:아바타|모델)/i.test(activityText)",
            "/(?:뉴|새|신규|new)?\\s*(?:오리지널\\s*)?(?:아바타|모델|의상|데뷔)|신의상|리뉴얼\\s*(?:아바타|모델)/i.test(activityText)",
            1
          )
          core_path.write_text(core)

          enrich_path = Path('lib/event-enrichment.js')
          enrich = enrich_path.read_text()
          old_enrich = """  const combined = `${title}\\n${body}`;\n  const detected = detectSpecificActivity(combined);\n  if (!detected) return null;"""
          new_enrich = """  const combined = `${title}\\n${body}`;\n\n  const externalApplication = /(?:콘텐츠|컨텐츠|대회|합방|팀)[^.!?\\n]{0,80}(?:지원(?:합니다|했|해|서|중)?|참가\\s*신청|신청(?:합니다|했|해|서|중)?|지원서)|(?:지원(?:합니다|했|해|서|중)?|참가\\s*신청|신청(?:합니다|했|해|서|중)?|지원서)[^.!?\\n]{0,80}(?:콘텐츠|컨텐츠|대회|합방|팀)/i.test(combined);\n  const participationConfirmed = /(?:최종\\s*)?(?:선발|선정|합격)\\s*(?:됐|되었|되었습니다|완료|확정|했|했습니다)|(?:참가|참여|출전)\\s*(?:확정|합니다|해요|하게\\s*됐|하게\\s*되었습니다)/i.test(combined);\n  const confirmationNegated = /(?:아직|미정|확정\\s*[xX]|확정\\s*아님|아닌|아니|여부|대기)[^.!?\\n]{0,60}(?:선발|선정|합격|참가|참여|출전|확정)|(?:선발|선정|합격|참가|참여|출전|확정)[^.!?\\n]{0,60}(?:아직|미정|[xX]|아님|아닌|아니|여부|대기)/i.test(combined);\n  if (externalApplication && (!participationConfirmed || confirmationNegated)) return null;\n\n  const personalCelebration = /(?:오리지널\\s*(?:데뷔|아바타|모델)|새\\s*(?:아바타|모델|의상)|신의상|리뉴얼\\s*(?:아바타|모델))/i.test(combined) &&\n    /축하|공개|출시|예쁘|데뷔/i.test(combined);\n  if (personalCelebration) return null;\n\n  const nonNewsMediaPost = /AI\\s*게시판/i.test(board) &&\n    /썸네일|다시보기|리플레이|하이라이트|클립|후기/i.test(combined);\n  if (nonNewsMediaPost) return null;\n\n  const detected = detectSpecificActivity(combined);\n  if (!detected) return null;"""
          if old_enrich not in enrich:
            raise SystemExit('enrichment marker not found')
          enrich_path.write_text(enrich.replace(old_enrich, new_enrich, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/crew-news-batch-core.js lib/event-enrichment.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: block non-news crew posts in all selection paths [editorial-followup-patch]"
          git push origin HEAD:fix/crew-editorial-policy-followup
